services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile-dev
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    depends_on:
      - catalog-service

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile-dev
    expose:
      - 8081
    environment:
      SERVER_PORT: 8081
    depends_on:
      - discovery-server

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile-dev
    expose:
      - 8761

networks:
  ecommerce-network:
    driver: bridge