services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    ports:
      # Access from your host machine
      - "29092:29092"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Internal and external listeners
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-node development configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Required KRaft cluster identifier
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  identity-worker:
    build:
      context: .
      dockerfile: identity-worker/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecommerce
      KEYCLOAK_ADMIN_CLIENT_ID: identity-worker
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    depends_on:
      - kafka
      - keycloak
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine3.24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/data
#    networks:
#      - ecommerce-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: ecommerce-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8380:8080"
      - "9000:9000"
    expose:
      - 8080
    depends_on:
      keycloak-db:
        condition: service_healthy
#    networks:
#      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    depends_on:
      - catalog-service
      - customer-service

  catalog-db:
    image: postgres:17-alpine3.24
    environment:
      POSTGRES_DB: ecommerce-catalog
      POSTGRES_PASSWORD: secret
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce-catalog" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
        - postgres_catalog_data:/var/lib/postgresql

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile-dev
    volumes:
      - ./catalog-service/src/main:/workspace/catalog-service/src/main
    expose:
      - 8081
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/ecommerce-catalog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_LIQUIBASE_ENABLED: true
    depends_on:
      - discovery-server

  customer-db:
    image: postgres:17-alpine3.24
    environment:
      POSTGRES_DB: ecommerce-customer
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce-customer" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_customer_data:/var/lib/postgresql

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile-dev
    volumes:
      - ./customer-service/src/main:/workspace/customer-service/src/main
      - ./service-comons/src/main:/workspace/service-comons/src/main
    expose:
      - 8082
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-db:5432/ecommerce-customer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_LIQUIBASE_ENABLED: true
    depends_on:
      - discovery-server
#    networks:
#      - ecommerce-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    expose:
      - 8761

#networks:
#  ecommerce-network:
#    driver: bridge

volumes:
  postgres_catalog_data:
  postgres_customer_data:
  keycloak-data:
  kafka-data: