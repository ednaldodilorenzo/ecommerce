databaseChangeLog:
  - changeSet:
      id: V1_001
      author: Ednaldo Dilorenzo
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: identity
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: cpf
                  type: CHAR(11)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: "now()"
              - column:
                  name: updated_date
                  type: TIMESTAMP
        - addUniqueConstraint:
            columnNames: cpf
            constraintName: user_cpf_unique
            tableName: users
        - addUniqueConstraint:
            columnNames: email
            constraintName: user_email_unique
            tableName: users